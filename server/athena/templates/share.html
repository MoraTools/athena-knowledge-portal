<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ article.title }} · Athena</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="{{ article.summary }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Athena">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="{{ article.title }}">
  <meta property="og:description" content="{{ article.summary }}">
  <meta property="og:url" content="{{ share_url }}">
  <meta property="og:image" content="{{ image_url }}">
  <meta property="og:image:type" content="{{ image.content_type }}">
  <meta property="og:image:width" content="{{ image.width }}">
  <meta property="og:image:height" content="{{ image.height }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta http-equiv="refresh" content="0;url={{ reader }}">
  <link rel="icon" href="/assets/favicon.svg">
</head>
<body>
  <p><a href="{{ reader }}">Abrir «{{ article.title }}» en Athena</a></p>
</body>
</html>
