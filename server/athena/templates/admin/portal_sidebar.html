<aside id="rail" class="rail" aria-label="Navegación del portal">
  <div class="rail-inner">
    <a class="rail-brand" href="/" aria-label="Athena, inicio"><span>ATHENA</span><small>KNOWLEDGE PORTAL</small></a>
    <nav class="rail-nav" aria-label="Portal">{% for group, links in groups %}
      <div class="rail-group">
        <h2 class="rail-group-label" id="rail-group-{{ forloop.counter }}">{{ group }}</h2>
        <ul aria-labelledby="rail-group-{{ forloop.counter }}">{% for label, href, current in links %}
          <li><a class="rail-item" href="{{ href }}"{% if current %} aria-current="page"{% endif %}><span class="rail-label">{{ label }}</span></a></li>{% endfor %}
        </ul>
      </div>{% endfor %}
    </nav>
    <button class="rail-toggle" type="button" aria-controls="rail" data-icon="collapse"><span class="rail-label">Contraer</span></button>
  </div>
</aside>
<button class="rail-reveal" type="button" aria-controls="rail" aria-label="Mostrar la navegación" data-icon="menu"></button>
