{% extends 'base.html' %}
{% block title %}Mi cuenta · Athena{% endblock %}
{% block content %}
<h1>Mi cuenta</h1>
<p>Sesión de <strong>{{ user.username }}</strong></p>
<nav class="account-links" aria-label="Mi cuenta">
  <a href="/">Abrir la biblioteca</a>
  {% if user.is_staff %}<a href="/admin/">Administrar Athena</a>{% endif %}
  <a href="/accounts/password_change/">Cambiar mi contraseña</a>
</nav>
<form method="post" action="/accounts/logout/" class="account-form">{% csrf_token %}<button type="submit">Cerrar sesión</button></form>
{% endblock %}
