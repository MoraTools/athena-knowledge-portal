{"id":"DL-0003","date":"2026-08-17","area":"operations","status":"accepted","title":"Cloudflare spending ceiling USD 0.00","context":"AGENTS.md; first recorded in commit 1a4c66b.","decision":"Use only Free-tier Cloudflare products that stop at their limit. Never enable R2, a paid plan, a paid add-on, or another metered resource. Never add a payment method or upgrade.","options":"","consequences":"Before any Cloudflare change, verify current pricing and plan; stop on any possible charge. Budget alerts are not a cap.","source":""},
{"id":"DL-0004","date":"2026-08-19","area":"architecture","status":"accepted","title":"In-browser search on its own route","context":"PRODUCT.md search decisions; commit ec0f3f9.","decision":"Replace the Docsify dropdown with a shareable search route (#/search?q=…). Search runs in the browser on an access-filtered index; matching ignores case and accents.","options":"Typo correction and fuzzy matching: rejected (DL-0005).","consequences":"","source":""},
{"id":"DL-0005","date":"2026-08-19","area":"architecture","status":"rejected","title":"Typo correction and fuzzy search","context":"PRODUCT.md: reconsider only when real usage shows it is necessary.","decision":"Do not add typo correction or fuzzy matching.","options":"","consequences":"","source":""},
{"id":"DL-0006","date":"2026-09-18","area":"architecture","status":"accepted","title":"Django, SQLite, Gunicorn, and Caddy on one DigitalOcean VPS","context":"Commit 2309084 added accounts, managed Markdown/PDF content, and a scoped REST API.","decision":"Serve the Docsify reader from Django on one DigitalOcean Droplet in NYC3. The SQLite database is the source of truth for articles, accounts, API keys, PDFs, and the download list.","options":"Cloudflare Workers, Functions, R2, or other metered Cloudflare features: excluded by DL-0003.","consequences":"Existing reader routes stay valid. Changes appear on the next page load without a build or redeploy. Base budget $12/month. Cloudflare and OneDrive tooling removed on 2026-10-02 (commit c036a43).","source":""},
{"id":"DL-0007","date":"2026-09-18","area":"security","status":"accepted","title":"Admin-managed accounts and scoped API keys","context":"","decision":"No public registration and no email password reset. Administrators manage accounts. Agents use scoped, expiring bearer keys, stored only as a hash.","options":"","consequences":"A password change invalidates other sessions and the user's API keys. Use a dedicated account for each agent.","source":""},
{"id":"DL-0008","date":"2026-09-18","area":"operations","status":"accepted","title":"Daily SQLite and media backups on the same VPS","context":"","decision":"A daily timer writes verified SQLite backups to /var/backups/athena (14 days) and mirrors private media; an atomic current link selects a matching database and media pair.","options":"Paid DigitalOcean backup or other paid add-on: not enabled.","consequences":"Backups do not cover VPS loss. Keep a separate copy of the database, download files, release bundle, and /etc/athena/athena.env. The media mirror has no history.","source":""},
{"id":"DL-0009","date":"2026-09-23","area":"data","status":"accepted","title":"Downloads on the VPS for signed-in users only","context":"","decision":"Store download files under /var/lib/athena/media/downloads/ and serve them through Django to signed-in users only, on one Descargas page.","options":"Pages Functions, Workers, R2, or another metered download service: rejected (AGENTS.md).","consequences":"OneDrive is no longer a download source. Uploads up to 512 MB pass the proxy on /admin/ and /api/.","source":""},
{"id":"DL-0010","date":"2026-09-23","area":"security","status":"accepted","title":"Escalating sign-in lockout","context":"","decision":"Five failed sign-ins in 15 minutes, per username or per address, lock sign-in for 15 minutes; each further lockout in a day doubles the wait, up to 24 hours.","options":"","consequences":"Applies to /accounts/login/ and /admin/login/. Administrators cannot unlock early.","source":""},
{"id":"DL-0011","date":"2026-09-25","area":"architecture","status":"accepted","title":"Server-side PDF export with WeasyPrint","context":"Commit 7ebdef1.","decision":"Render article Markdown to a plain A4 PDF on the server (markdown-it-py, WeasyPrint). Resources load only from data: URIs and raw.githubusercontent.com, without redirects.","options":"","consequences":"One render at a time: 30 s wall clock, 25 s CPU, 768 MiB address space, 25 MiB output; busy or failed exports return 503 with Retry-After: 10. The server needs Pango, HarfBuzz, and DejaVu fonts. Links use ATHENA_PUBLIC_ORIGIN, never the Host header.","source":""},
{"id":"DL-0012","date":"2026-09-29","area":"security","status":"accepted","title":"Public access separate from publication","context":"Commit 600c84a.","decision":"published controls release; is_public controls anonymous reading. Articles default to account-only access; drafts stay restricted. Public access covers metadata, images, attached PDFs, and PDF exports.","options":"","consequences":"Anonymous pages and search exclude private titles, tags, excerpts, counts, and download records. Search-engine indexing stays disabled (robots.txt, X-Robots-Tag).","source":""},
{"id":"DL-0013","date":"2026-09-29","area":"data","status":"accepted","title":"Managed private article images","context":"Commit 600c84a; animated GIF support added 2026-09-30 (commit 4409d3f).","decision":"Store images as private files in MEDIA_ROOT/article-images/ with generated names, served by Django with the access of the articles that use them. A daily timer removes unused images after a 24-hour grace period.","options":"","consequences":"PNG, JPEG, and WebP are re-encoded without metadata; GIF validation runs in a bounded worker. Article saves and cleanup share one SQLite write transaction.","source":""},
{"id":"DL-0014","date":"2026-10-07","area":"security","status":"accepted","title":"Temporarily disable user email entry","context":"Commit 3433e53 (breaking change).","decision":"Disable email entry in user forms and the API because Athena email is not configured. New users have a blank email; existing addresses stay.","options":"","consequences":"User API writes must omit email or send an empty or unchanged value.","source":""},
{"id":"DL-0015","date":"2026-10-29","area":"product","status":"accepted","title":"Suite theme A: One gold, light and dark, English and Spanish interface","context":"User decision 2026-10-29: \"Implement one gold\". Replaces the single black-and-gold theme and the fixed Spanish interface.","decision":"The reader, the account pages and the admin use the shared A tokens (src/assets/suite-tokens.css), Inter for the interface, Cormorant for the wordmark and page titles, and the system mono stack for labels and code. Two toggles at the far right switch theme and language. Choices are kept in suite.athena.theme and suite.athena.lang; with no choice, the browser preference applies; the default language is Spanish.","options":"A second server-side language (Django i18n): not used; UI and theme only, no Python logic change.","consequences":"English is a browser-side translation of interface strings (src/assets/suite-i18n.js); article prose under /content/ stays Spanish. The Django admin uses the same tokens, fonts and toggles; Athena's own admin strings switch language, Django's built-in admin strings stay Spanish (no settings change). The previous admin fonts were removed. Portal version 1.10.0.","source":"src/assets/suite-tokens.css, src/assets/boot.js, src/assets/suite.js, src/assets/suite-i18n.js, scripts/test-suite-theme.mjs"}

nchor='middle' fill='currentColor' stroke='none'>articles, users, PDFs\u003c/text>\n\u003crect x='610' y='160' width='140' height='50' rx='4'/>\u003ctext x='680' y='182' text-anchor='middle' fill='currentColor' stroke='none'>Media files\u003c/text>\u003ctext x='680' y='200' text-anchor='middle' fill='currentColor' stroke='none'>images, downloads\u003c/text>\n\u003cpath d='M150 55H208' marker-end='url(#a)'/>\u003ctext x='179' y='47' text-anchor='middle' fill='currentColor' stroke='none'>HTTPS\u003c/text>\n\u003cpath d='M150 185L208 70' marker-end='url(#a)'/>\n\u003cpath d='M330 55H388' marker-end='url(#a)'/>\u003ctext x='359' y='47' text-anchor='middle' fill='currentColor' stroke='none'>proxy\u003c/text>\n\u003cpath d='M550 55H608' marker-end='url(#a)'/>\n\u003cpath d='M470 80V158' marker-end='url(#a)'/>\u003ctext x='478' y='124' fill='currentColor' stroke='none'>render\u003c/text>\n\u003cpath d='M550 70L608 175' marker-end='url(#a)'/>\n\u003c/svg>\n\n| Part | Role |\n|---|---|\n| Docsify 5.0.0 reader | Spanish reader; existing routes stay valid; search on an access-filtered index |\n| Caddy | HTTPS certificates, static files, proxy to Gunicorn; 512 MB body limit on /admin/ and /api/, 27 MB elsewhere |\n| Django 5.2.17 + Gunicorn | Accounts, admin, articles, downloads, REST API 1.6.0 (/api/openapi.json) |\n| SQLite (/var/lib/athena/athena.sqlite3) | Source of truth: articles, accounts, keys, PDFs, download list |\n| Media (/var/lib/athena/media/) | Private article images and download files, served by Django |\n| WeasyPrint | PDF exports, cached in /var/lib/athena/pdf-cache/ |\n\n- dist/ holds the approved migration input and reader static pages. It is private and excluded from Git; restore it from .secrets/athena-vps-release.tar.gz or the VPS.\n- import_portal loads dist/ into the database once. It skips existing slugs; do not rerun it after deleting imported articles.","deployment":"| Item | Value |\n|---|---|\n| Site | https://athena.moratechnology.com (admin: /admin/) |\n| Host | DigitalOcean Droplet 600852697, NYC3, 1 vCPU, 2 GiB RAM, 50 GiB disk, IPv4 159.203.121.42 |\n| DNS | A record athena at the existing DNS provider; do not change parent-domain nameservers or other records |\n| App | /opt/athena, service athena (user athena, systemd sandbox, writes only /var/lib/athena) |\n| Data | /var/lib/athena (database, media, PDF cache) |\n| Configuration | /etc/athena/athena.env (root only) |\n| Firewall | SSH, HTTP, HTTPS only; Gunicorn on loopback |\n| Timers | athena-backup.timer (daily), athena-image-gc.timer (daily) |\n\n1. First install: deploy/cloud-init.yaml, copy the release to /opt/athena, run deploy/install.sh.\n2. Update: back up, copy changed code, install pinned requirements, migrate, collect static files, restart athena.\n3. **Do not run import_portal on routine updates.** Preserve /var/lib/athena and /etc/athena.\n\n```sh\nsystemctl status athena caddy\njournalctl -u athena -n 50 --no-pager\nsystemctl start athena-backup\nsystemctl list-timers athena-backup.timer\n```\n\nRestore: stop athena and the backup timer, resolve /var/backups/athena/current once, copy database.sqlite3 and media/ from that directory, set owner athena:athena, restart, then test sign-in, article/PDF access, and downloads.","development":"Needs Python 3.12+ and Node.js. Restore dist/ before the first build.\n\n```sh\npython3 -m venv .venv\n.venv/bin/pip install -r requirements.txt\nnpm ci --ignore-scripts\nnpm run build\nexport ATHENA_DEBUG=1  # also set ATHENA_SECRET_KEY to a random local value\n.venv/bin/python server/manage.py migrate\n.venv/bin/python server/manage.py import_portal\n.venv/bin/python server/manage.py createsuperuser\n.venv/bin/python server/manage.py runserver 127.0.0.1:8765\nnpm test\n```\n\n| Command | Does |\n|---|---|\n| npm run build | scripts/build-vps.py: copies DOMPurify, Docsify, and marked into dist/vendor; keeps article and download data |\n| npm test | Django tests (athena), search, article image, editor, and image queue scripts, deploy/test_backup.py |\n| npm run build:legacy, npm run test:legacy | Original Windows build and checks (pwsh); run only in a disposable copy, they replace dist/ |\n\nPinned: Docsify 5.0.0, DOMPurify 3.4.15, marked 18.0.9. Set ATHENA_PUBLIC_ORIGIN to the local preview URL to test PDF links."}

return new XMLSerializer().serializeToString(top);
}
function markdown(lines){
let out='',i=0;
const cells=s=>s.replace(/\\\|/g,'\u0001').trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim().replace(/\u0001/g,'|'));// \| is a literal pipe.
while(i<lines.length){
const line=lines[i];if(!line.trim()){i++;continue}
if(/^\s*```/.test(line)){let code=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))code.push(lines[i++]);i++;out+='<pre><button type="button" class="copy"></button><code>'+esc(code.join('\n'))+'</code></pre>';continue}
if(/^\s*<svg\b/.test(line)){let raw=[];do{raw.push(lines[i++])}while(i<lines.length&&!raw[raw.length-1].includes('</svg>'));out+=svg(raw.join('\n'));continue}
if(/^\s*\|/.test(line)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(cells(lines[i++]));out+='<div class="table-wrap"><table><thead><tr>'+rows.shift().map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.filter(r=>!r.every(c=>/^:?-{3,}:?$/.test(c))).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
const head=line.match(/^(#{1,2}) (.*)/);if(head){const h='h'+(head[1].length+2);out+='<'+h+'>'+inline(head[2])+'</'+h+'>';i++;continue}
const [tag,re]=/^\s*- /.test(line)?['ul',/^\s*- /]:['ol',/^\s*\d+\. /];
if(re.test(line)){out+='<'+tag+'>';while(i<lines.length&&re.test(lines[i]))out+='<li>'+inline(lines[i++].replace(re,''))+'</li>';out+='</'+tag+'>';continue}
let p=[lines[i++]];while(i<lines.length&&lines[i].trim()&&!/^(\s*(```|<svg\b|\||- |\d+\. )|##? )/.test(lines[i]))p.push(lines[i++]);out+='<p>'+inline(p.join('\n'))+'</p>';
}return out;
}
function render(){
root.lang=lang;document.title=text(data.title);$('main h1').textContent=text(data.title);
const brand=$('.brand'),title=text(data.title);brand.textContent=title;
if(data.logo&&safe(data.logo)){const img=new Image();img.alt=title;img.onerror=()=>img.replaceWith(title);img.src=data.logo;brand.replaceChildren(img)}
$('.meta').textContent=t('updated')+' '+data.updated;$('.skip').textContent=t('skip');
const sections=[];const add=(id,title,body)=>{if(body)sections.push({id,title,body})};
const badge=s=>'<span class="badge '+s+'">'+esc(t(s))+'</span>';
add('decisions',t('decisions'),[...data.decisions].sort((a,b)=>b.id.localeCompare(a.id,'en',{numeric:true})).map(d=>{
const tag='<span class="tag"><span class="id">'+esc(d.id)+'</span> · '+esc([d.date||t('dateUnknown'),t(d.area).toLowerCase()].join(' · '))+'</span> '+badge(d.status);
const body='<dl>'+['context','decision','options','consequences'].map(k=>text(d[k])?'<dt>'+t(k)+'</dt><dd>'+inline(text(d[k]))+'</dd>':'').join('')+(d.source?'<dt>'+t('source')+'</dt><dd>'+inline(d.source)+'</dd>':'')+'</dl>';
return d.status==='rejected'?'<details id="'+d.id+'" class="dim"><summary>'+tag+' '+inline(text(d.title))+'</summary>'+body+'</details>':'<article id="'+d.id+'">'+tag+'<h3>'+inline(text(d.title))+'</h3>'+body+'</article>'}).join(''));
add('status',t('status'),text(data.status)?'<p>'+inline(text(data.status))+'</p>':'');
// Active items first; in each group high, then medium or none, then low; else the stored order.
const pri=data.open.some(o=>o.priority),rank=o=>['done','dropped'].includes(o.status)*3+({high:0,low:2}[o.priority]??1);
add('open',t('work'),data.open.length?'<div class="table-wrap"><table><thead><tr>'+['ID',t('item'),t('status'),...pri?[t('priority')]:[],t('owner')].map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+[...data.open].sort((a,b)=>rank(a)-rank(b)).map(o=>'<tr id="'+esc(o.id)+'" class="'+esc(o.status)+'"><td class="id">'+esc(o.id)+'</td><td>'+inline(text(o.item))+'</td><td>'+badge(o.status)+'</td>'+(pri?'<td>'+(o.priority?esc(t(o.priority)):'')+'</td>':'')+'<td>'+esc(o.owner)+'</td></tr>').join('')+'</tbody></table></div>':'');
const fixed=['architecture','deployment','development'];
for(const key of [...fixed,...Object.keys(data.sections).filter(k=>!fixed.includes(k))]){
const lines=text(data.sections[key]).replace(/\r/g,'').split('\n'),own=!fixed.includes(key)&&/^# /.test(lines[0]);
add('section-'+key,own?lines.shift().slice(2):fixed.includes(key)?t(key):key[0].toUpperCase()+key.slice(1).replace(/-/g,' '),markdown(lines));
}
$('#content').innerHTML=sections.map(s=>'<section id="'+s.id+'"><h2>'+esc(s.title)+'</h2>'+s.body+'</section>').join('');
const nav=$('nav');nav.setAttribute('aria-label',t('sections'));nav.innerHTML=sections.map(s=>'<a href="#'+s.id+'">'+esc(s.title)+'</a>').join('');
$$('.copy').forEach(b=>{b.textContent=t('copy');b.setAttribute('aria-live','polite');b.onclick=async()=>{try{await navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent=t('copied')}catch(e){b.textContent=t('copyFailed')}}});
const toggle=$('#language');toggle.hidden=data.langs.length!==2;toggle.textContent=L[data.langs.find(l=>l!==lang)]?.name||'';
themeLabel();spy();
}
function spy(){
if(clicked&&(pinY===undefined||scrollY===pinY))return mark(clicked);
clicked=null;const sections=[...$$('section')],limit=parseFloat(getComputedStyle(root).scrollPaddingTop)+8;let id=sections[0]?.id;
for(const s of sections)if(s.getBoundingClientRect().top<=limit)id=s.id;
mark(id);
}
function mark(id){const nav=$('nav');for(const a of $$('nav a'))if(a.hash==='#'+id){a.setAttribute('aria-current','true');if(nav.scrollWidth>nav.clientWidth)nav.scrollLeft=a.offsetLeft-nav.offsetLeft-(nav.clientWidth-a.offsetWidth)/2}else a.removeAttribute('aria-current')}
function opened(){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target?.tagName==='DETAILS')target.open=true}
// The icon shows the theme that a click selects: a moon in light mode, a sun in dark mode.
const icons={dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.1A8 8 0 1 0 19.9 13A6.5 6.5 0 0 1 11 4.1z" fill="currentColor"/></svg>',light:'<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>'};
function themeLabel(){const b=$('#theme'),next=getComputedStyle(root).colorScheme==='dark'?'light':'dark';b.innerHTML=icons[next];b.setAttribute('aria-label',t(next));b.title=t('theme')}
$('nav').onclick=e=>{const a=e.target.closest('a');if(a){clicked=a.hash.slice(1);pinY=undefined;mark(clicked);requestAnimationFrame(()=>{pinY=scrollY})}};
$('#theme').onclick=()=>{const theme=getComputedStyle(root).colorScheme==='dark'?'light':'dark';
if(matchMedia('(prefers-color-scheme:dark)').matches===(theme==='dark')){delete root.dataset.theme;store('html-docs-theme',null)}else{root.dataset.theme=theme;store('html-docs-theme',theme)}themeLabel()};
$('#language').onclick=()=>{lang=data.langs.find(l=>l!==lang);store('html-docs-lang',lang);render()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeLabel);
addEventListener('scroll',spy,{passive:true});addEventListener('resize',spy);addEventListener('hashchange',opened);
let closed=[];addEventListener('beforeprint',()=>{closed=[...$$('details:not([open])')];closed.forEach(d=>d.open=true)});addEventListener('afterprint',()=>closed.forEach(d=>d.open=false));
render();opened();
</script>
